<mat-toolbar color="primary" data-testid="toolbar">
  <button mat-icon-button (click)="toggleSidenav()" data-testid="menu-toggle">
    <mat-icon>menu</mat-icon>
  </button>
  <span data-testid="app-title">AI Demo App</span>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="sidenavOpened()"
    data-testid="sidenav"
  >
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive="active-link"
          [attr.data-testid]="'nav-' + item.label.toLowerCase()"
          (click)="isMobile() ? sidenav.close() : null"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
