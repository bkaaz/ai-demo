<div class="users-page" data-testid="users-page">
  <h1 data-testid="page-title">Users</h1>

  <mat-card>
    <mat-card-content>
      <div class="filters" data-testid="filters">
        <mat-form-field appearance="outline">
          <mat-label>Search users</mat-label>
          <input
            matInput
            [value]="searchValue()"
            (input)="onSearchChange($any($event.target).value)"
            placeholder="Name or email..."
            data-testid="search-input"
          />
          <mat-icon matPrefix>search</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Role</mat-label>
          <mat-select
            [value]="selectedRole()"
            (selectionChange)="onRoleChange($event.value)"
            data-testid="role-filter"
          >
            @for (role of roles; track role) {
              <mat-option [value]="role">{{ role }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <table mat-table [dataSource]="dataSource" matSort data-testid="users-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header data-testid="sort-name">Name</th>
          <td mat-cell *matCellDef="let user">{{ user.name }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header data-testid="sort-email">Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Role</th>
          <td mat-cell *matCellDef="let user">{{ user.role }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
          <td mat-cell *matCellDef="let user">
            <span class="status-badge" [class]="user.status.toLowerCase()">{{ user.status }}</span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" data-testid="user-row"></tr>
      </table>

      @if (dataSource.filteredData.length === 0) {
        <div class="empty-state" data-testid="empty-state">
          <mat-icon>search_off</mat-icon>
          <p>No users found matching your criteria</p>
        </div>
      }

      <mat-paginator
        [pageSizeOptions]="[5, 10, 15]"
        [pageSize]="5"
        showFirstLastButtons
        data-testid="paginator"
      ></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
